---
- name: Template systemd service file
  template:
    src: gosip-push-gateway.service.j2
    dest: /etc/systemd/system/gosip-push-gateway.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart gosip-push-gateway

- name: Reload systemd daemon
  command: systemctl daemon-reload

- name: Ensure gosip-push-gateway is enabled and started
  command: systemctl enable --now gosip-push-gateway
  ignore_errors: yes

- name: Fallback start if systemd daemon is not running in container
  shell: nohup /usr/local/bin/gosip-push-gateway -config /etc/gosip-push-gateway/config.toml > /var/log/gosip-push-gateway/gateway.log 2>&1 &
  become: yes
  become_user: gosip
  ignore_errors: yes

- name: Pause briefly for service to bind port
  pause:
    seconds: 2
