---
- name: Verify
  hosts: all
  become: no
  tasks:
    - name: Check if gosip user exists
      getent:
        database: passwd
        key: gosip
      failed_when: "'gosip' not in ansible_facts.getent_passwd"

    - name: Check if binary exists and is executable
      stat:
        path: /usr/local/bin/gosip-push-gateway
      register: bin_stat
      failed_when: not bin_stat.stat.exists or not bin_stat.stat.executable

    - name: Check if configuration file exists
      stat:
        path: /etc/gosip-push-gateway/config.toml
      register: conf_stat
      failed_when: not conf_stat.stat.exists

    - name: Check gosip-push-gateway process is running
      command: pgrep -x gosip-push-gateway
      register: proc_check
      changed_when: false
      failed_when: false

    - name: Check systemd service unit exists and status
      command: systemctl status gosip-push-gateway
      register: service_status_cmd
      changed_when: false
      failed_when: false

    - name: Verify binary runs with config test / help flag
      command: /usr/local/bin/gosip-push-gateway -help
      register: help_run
      failed_when: false

    - name: Ensure gateway process is running for verification
      shell: "pgrep -x gosip-push-gateway || nohup /usr/local/bin/gosip-push-gateway -config /etc/gosip-push-gateway/config.toml > /var/log/gosip-push-gateway/gateway.log 2>&1 &"
      become: yes
      become_user: gosip
      changed_when: false
      failed_when: false

    - name: Check listening ports (SIP 5060)
      wait_for:
        port: 5060
        timeout: 10
      register: port_check
