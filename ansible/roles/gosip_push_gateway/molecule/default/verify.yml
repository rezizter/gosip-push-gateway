---
- name: Verify
  hosts: all
  become: yes
  tasks:
    - name: Check if gosip user exists
      getent:
        database: passwd
        key: gosip
      failed_when: "'gosip' not in ansible_facts.getent_passwd"

    - name: Check if binary exists and is executable
      stat:
        path: /usr/local/bin/gosip-push-gateway
      register: bin_stat
      failed_when: not bin_stat.stat.exists or not bin_stat.stat.executable

    - name: Check if configuration file exists
      stat:
        path: /etc/gosip-push-gateway/config.toml
      register: conf_stat
      failed_when: not conf_stat.stat.exists

    - name: Check systemd service status
      systemd:
        name: gosip-push-gateway
        state: started
        enabled: yes
      register: service_status

    - name: Verify binary runs with config test / help flag
      command: /usr/local/bin/gosip-push-gateway -help
      register: help_run
      failed_when: false

    - name: Check listening ports (SIP 5060)
      wait_for:
        port: 5060
        timeout: 5
      ignore_errors: yes
      register: port_check
