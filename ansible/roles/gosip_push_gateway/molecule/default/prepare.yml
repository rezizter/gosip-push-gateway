---
- name: Prepare
  hosts: all
  gather_facts: no
  tasks:
    - name: Update apt cache and install python3 on Debian/Ubuntu
      raw: "apt-get update && apt-get install -y python3 python3-apt python3-minimal"
      changed_when: false
      failed_when: false
      ignore_errors: yes

    - name: Install python3 on RedHat/Amazon Linux
      raw: "dnf install -y python3 shadow-utils || yum install -y python3 shadow-utils"
      changed_when: false
      failed_when: false
      ignore_errors: yes
